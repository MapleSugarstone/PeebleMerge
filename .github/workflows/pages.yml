name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Run engine tests
        run: node --test tests/engine.test.js tests/fall.test.js tests/space.test.js tests/daily.test.js

      # Only the files the page loads go into the site, so tests and tools stay out of it.
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html style.css favicon.svg apple-touch-icon.png preview.png js assets _site/
          sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" _site/index.html _site/js/*.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
