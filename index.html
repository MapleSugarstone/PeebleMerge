<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#e6f1d8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Peeble Merge</title>
<meta name="description" content="4x4 merge game">
<meta property="og:type" content="website">
<meta property="og:title" content="Peeble Merge">
<meta property="og:description" content="4x4 merge game">
<meta property="og:url" content="https://maplesugarstone.github.io/PeebleMerge/">
<meta property="og:image" content="https://maplesugarstone.github.io/PeebleMerge/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A 4x4 game board">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css?v=dev">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="stat">
      <span class="stat-label">Score</span>
      <span class="stat-value" id="score">0</span>
    </div>
    <div class="stat stat-right">
      <span class="stat-label">Best</span>
      <span class="stat-value small" id="best">0</span>
    </div>
    <button class="icon-btn" id="sound-btn" aria-label="Sound on">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.3 9.5h3.5l4.5-4v13l-4.5-4H3.3z" fill="currentColor"/><path class="sound-waves" d="M14.8 9a4 4 0 0 1 0 6M17.3 6.5a7.5 7.5 0 0 1 0 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><path class="sound-off" d="M15.3 9.5l5 5M20.3 9.5l-5 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <button class="icon-btn" id="menu-btn" aria-label="Menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
    </button>
  </header>

  <div class="level-bar" title="Merges fill this bar. Each level gives a random item.">
    <span class="plv" id="plv">1</span>
    <div class="xp-track"><div class="xp-fill" id="xp-fill"></div></div>
    <span class="xp-text" id="xp-text">0 / 60</span>
  </div>

  <div class="board-wrap" id="board-wrap">
    <div class="board" id="board"></div>
    <div class="drop-toast" id="drop-toast" hidden></div>
  </div>

  <div class="tool-area">
  <div class="picker" id="picker" hidden></div>
  <div class="tools" id="tools"></div>
  </div>

  <button class="place-btn" id="place-btn">
    <span class="next-tile" id="next-tile"></span>
    <span class="place-label">Place</span>
  </button>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<script type="module" src="js/main.js?v=dev"></script>
</body>
</html>
